# Organizations shown in the "Sponsors and partners" logo wall on the Projects page.
# group: sponsor (federal agencies, foundations, societies) | partner (industry)
# logo: optional filename in public/images/logos/ (SVG or PNG on a transparent or white background).
#       Without one, the organization's name is shown in the tile instead.
# showName: true to print the name under the tile (for seals and emblems without text).
# order: position in the wall (lower first).
# url: optional link to the organization's website.

- id: doe
  order: 1
  logo: doe.png
  showName: true
  name: U.S. Department of Energy
  short: DOE
  note: Including ARPA-E and the Office of Fossil Energy and Carbon Management
  group: sponsor
  url: https://www.energy.gov

