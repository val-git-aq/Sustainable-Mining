  themes: [lithium]
  bio: >-
    Sima Nikfar is a Ph.D. candidate in Metallurgical Engineering at the University of Nevada, Reno. She holds a B.S. in
    Chemical Engineering from Babol Noshirvani University of Technology and an M.S. in Chemical Engineering–Biotechnology
    from Tarbiat Modares University. Her research focuses on sustainable lithium extraction, separation, and
    purification, including direct lithium extraction (DLE), electrochemical processes, and solvent extraction, as well
    as life cycle assessment (LCA) and techno-economic analysis (TEA).

    Sima has gained industry experience through internships at Lithium Americas as a Process Engineer, Aqua Metals as an
    R&D Engineer, Freeport-McMoRan as a Metallurgical Engineer, and Redwood Materials as an Electrochemical Engineer.

    Outside of her research, she enjoys hiking, cooking, and spending time with friends.
  personalPhoto:
    src: sima-nikfar-personal.webp
    alt: Sima Nikfar smiling in a burgundy sweater in front of colourful hand-woven textiles and a patterned wall hanging

