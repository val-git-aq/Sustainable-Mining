  project: "Sustainable Lithium Production Pathways: Environmental and Economic Assessment and Process Optimization to Maximize Benefits"
  themes: [lithium, battery-recycling]
  bio: >-
    Kamal Mousavi is a Ph.D. candidate in Metallurgical Engineering at the University of Nevada, Reno. He holds a B.Sc.
    in Mining Engineering from Sahand University of Technology and an M.Sc. in Mineral Processing from the University
    of Tehran. His research focuses on sustainable lithium extraction, separation, and purification, including direct
    lithium extraction (DLE), electrochemical processes, life cycle assessment (LCA), and techno-economic analysis (TEA).

    Since summer 2024, he has worked as an Electrochemical Engineering Intern at Redwood Materials, focusing on
    lithium-ion battery recycling. He also completed an internship at Freeport-McMoRan's Henderson Mine in Colorado.

    Outside of research, he enjoys travelling, cooking Persian food, and sharing it with friends.
  personalPhoto:
    src: kamal-mousavi-outdoors.jpg
    alt: Kamal Mousavi standing on wide stone steps in front of tall columns topped with carved Persian-style animal capitals, under a blue sky
    caption: Travelling is one of Kamal's favourite ways to spend time outside the lab.

