  themes: [lithium]
  bio: >-
    Andrea Oviatt is currently graduating with a BS in Metallurgical Engineering from the University of Nevada, Reno in
    May 2027. She has conducted research in pre-treating lithium to maximize recovery, process optimization for a
    continuous flow analysis (CFA) system used for ice cores, and testing recovery of metals from recycled photovoltaic
    modules. She has high proficiency in cyanide digestion, experimental design, Python data visualization, and Atomic
    Absorption Spectroscopy (AAS).

    Outside the lab, she enjoys collecting niche perfumes, reading philosophy (shoutout to Simone de Beauvoir!!!), and using oil pastels.
  personalPhoto:
    src: andrea-oviatt-poster.jpg
    heading: Presenting her research
    alt: Andrea Oviatt smiling beside her research poster on characterizing a water isotope continuous flow analysis system for ice cores
    caption: Presenting her poster on a continuous flow analysis (CFA) system for ice core samples.

